<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Personas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout-container">
    <!-- Header -->
    <header class="header">
      <div class="container text-center">
        <h1>EventGest</h1>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-panel">
      <!-- Side Panel (30%) -->
      <div class="side-panel col-md-4 col-lg-3">
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-menu">
            <i class="bi bi-house me-2"></i>Home
          </button>
          <button type="button" class="btn btn-menu">
            <i class="bi bi-calendar-event me-2"></i>Eventos
          </button>
          <button type="button" class="btn btn-menu">
            <i class="bi bi-people me-2"></i>Personas
          </button>
          <button type="button" class="btn btn-menu">
            <i class="bi bi-file-earmark-text me-2"></i>Informes
          </button>
        </div>
      </div>

      <!-- Content Panel (70%) -->
      <div class="content-panel col-md-8 col-lg-9 d-flex align-items-center">
        <div class="container">
          <h2 class="text-center mb-4">Gestión de personas</h2>
          
          <div class="row g-4">
            <div class="col-6 col-md-3">
              <div class="card-option">
                <i class="bi bi-person-plus"></i>
                <span>Crear</span>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="card-option">
                <i class="bi bi-search"></i>
                <span>Buscar</span>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="card-option">
                <i class="bi bi-pencil-square"></i>
                <span>Modificar</span>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="card-option">
                <i class="bi bi-trash"></i>
                <span>Eliminar</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
