<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Personas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="layout-container">
    <!-- Header -->
    <header class="header">
      <div class="container text-center">
        <h1>EventGest</h1>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-panel">
      <!-- Side Panel (30%) -->
      <div class="side-panel col-md-4 col-lg-3">
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-menu">
            <i class="bi bi-house me-2"></i>Home
          </button>
          <button type="button" class="btn btn-menu">
            <i class="bi bi-calendar-event me-2"></i>Eventos
          </button>
          <button type="button" class="btn btn-menu">
            <i class="bi bi-people me-2"></i>Personas
          </button>
          <button type="button" class="btn btn-menu">
            <i class="bi bi-file-earmark-text me-2"></i>Informes
          </button>
        </div>
      </div>

      <!-- Content Panel (70%) -->
      <div class="content-panel col-md-8 col-lg-9 d-flex align-items-center justify-content-center">
        <div class="container" style="max-width: 1200px;">

          <!-- Botón de volver -->
          <div class="mb-3">
            <button type="button" class="btn btn-outline-secondary" onclick="window.history.back()">
              <i class="bi bi-arrow-left"></i>
            </button>
          </div>

          <h2 class="text-center mb-4">Crear una persona</h2>

          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="cc" class="form-label">CC</label>
                <input type="text" class="form-control" id="cc" placeholder="ej.12345" style="height: 4em;">
              </div>
              <div class="col-md-6">
                <label for="apellido" class="form-label">Apellidos</label>
                <input type="text" class="form-control" id="apellido" placeholder="Apellidos" style="height: 4em;">
              </div>
              <div class="col-md-6">
                <label for="nombre" class="form-label">Nombres</label>
                <input type="text" class="form-control" id="nombre" placeholder="Nombres" style="height: 4em;">
              </div>
              <div class="col-md-6">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="direccion" placeholder="Dirección" style="height: 4em;">
              </div>
              <div class="col-md-6">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="telefono" placeholder="Teléfono" style="height: 4em;">
              </div>
              <div class="col-md-6">
                <label for="correo" class="form-label">Correo</label>
                <input type="email" class="form-control" id="correo" placeholder="Correo" style="height: 4em;">
              </div>
            </div>
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-warning btn-lg">Crear</button>
            </div>
          </form>
        </div>
      </div>


    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
