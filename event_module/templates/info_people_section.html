{% csrf_token %}
<label for="create-detail-cc"><strong>CC:</strong></label>
<input name="dni" type="number" class="create-detail-cc control-form form-control mb-2" required>
  
<label for="create-detail-nombre"><strong>Nombre:</strong></label>
<input name="name" type="text" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="Solo puede contener letras y espacios (ej: Juan Jose)" class="create-detail-nombre control-form form-control mb-2" required>

  
<label for="create-detail-telefono"><strong>Teléfono:</strong></label>
<input name="phoneNumber" type="number" class="create-detail-telefono control-form form-control mb-2" required>
  
<label for="create-detail-direccion"><strong>Dirección:</strong></label>
<input name="address" type="text" class="create-detail-direccion control-form form-control mb-2" required>
  
<label for="create-detail-correo"><strong>Correo:</strong></label>
<input name="email" pattern="^[^@]+@[^@]+\.[^@]+$" title="Ingresa un correo válido con un punto después del arroba (ej: nombre@dominio.com)" class="create-detail-correo control-form form-control mb-2" required>
