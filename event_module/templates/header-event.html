{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Persona</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script type="module" src="{% static 'js/manage_events/main.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/manage_events/general-styles.css' %}">
</head>

<body>
    <div class="layout-container">
        <!-- Cabecera principal movible -->
        <header class="header col-md-12" style="position:fixed; height:15vh">

            <div class="container text-center">
                <h1><a class="title-a" href="{% url 'index' %}">
                        <i class="fa-brands fa-redhat main-icon"></i>EventGest
                    </a></h1>
            </div>

        </header>

        <!-- Contenido principal -->
        <div class="main-panel d-flex">

            <!-- Ventana pop up emergente-->
            {% include 'pop-up-window.html' %}

            <!-- Barra lateral movible-->
            {% include 'lateral-bar.html' %}

            <div class="main-panel main-content">

                {% block content %}
                {% endblock %}
            </div>

</body>

</html>
