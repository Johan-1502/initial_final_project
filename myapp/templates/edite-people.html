{% extends 'barra_lateral.html' %}

{% block content %}

    <div class="main-panel">
      <!--
        <div class="side-panel col-md-4 col-lg-3">
          <div class="d-grid gap-2">
            <a href="{% url 'show_people' %}" class="btn btn-menu">
              <i class="bi bi-house me-2"></i>Home
            </a>
            <a href="{% url 'create_person' %}" class="btn btn-menu">
              <i class="bi bi-calendar-event me-2"></i>Crear Persona
            </a>
            <a href="{% url 'search_person' %}" class="btn btn-menu">
              <i class="bi bi-people me-2"></i>Buscar Persona
            </a>
            <a href="{% url 'show_people' %}" class="btn btn-menu">
              <i class="bi bi-file-earmark-text me-2"></i>Ver Personas
            </a>
          </div>
        </div>
        -->

      <!-- Content Panel -->
      <div class="content-panel col-md-8 col-lg-9 d-flex align-items-center justify-content-center">
        <div class="container" style="max-width: 1200px;">

          <!-- Botón de volver -->
          <div class="mb-3">
            <button type="button" class="btn btn-outline-secondary" onclick="window.history.back()">
              <i class="bi bi-arrow-left"></i>
            </button>
          </div>

          <h2 class="text-center mb-4">Editar Persona</h2>

          <div class="row g-3">
            <!-- Panel de búsqueda -->
            <div class="col-md-6">

              <form action="{% url 'search_person_to_edit' %}" method="POST">
                {% csrf_token %}
                <label for="searchInput" class="form-label fw-bold">Buscar por CC / Nombre</label>
                <input id="searchInput" name="dni" type="text" class="form-control mb-3"
                  placeholder="Escribe un nombre o cédula..." style="height: 4em;">
      
                <button class="btn btn-warning btn-lg rounded-3 mb-3">
                  buscar
                </button>
              </form>

              <ul id="resultsList" class="list-group">
                {% for person in people %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  <span>{{ person.dni }} - {{ person.name }}</span>
                  <button class="btn btn-sm btn-outline-primary" onclick="viewPerson('{{ person.dni }}')">Ver</button>
                </li>
                {% endfor %}
              </ul>
            </div>

            <!-- Panel de detalles -->
            <div class="col-md-6">
              <h5 class="fw-bold">Persona Seleccionada</h5>
              <div id="selectedPerson">
                <p><strong>CC:</strong> <span id="detail-cc">---</span></p>
                <p><strong>Nombre:</strong> <span id="detail-nombre">---</span></p>
                <p><strong>Teléfono:</strong> <span id="detail-telefono">---</span></p>
                <p><strong>Dirección:</strong> <span id="detail-direccion">---</span></p>
                <p><strong>Correo:</strong> <span id="detail-correo">---</span></p>
              </div>

              <!-- Botón Editar persona -->
              <div class="d-grid mt-3">
                <button id="editPersonBtn" class="btn btn-warning btn-lg rounded-3">Editar persona</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Filtrar personas en la lista
    document.getElementById('searchInput').addEventListener('input', function () {
      const filter = this.value.toLowerCase(); // Obtiene el texto ingresado en minúsculas
      const items = document.querySelectorAll('#resultsList li'); // Selecciona todos los elementos de la lista

      items.forEach(item => {
        const text = item.querySelector('span').textContent.toLowerCase(); // Obtiene el texto del elemento
        item.style.display = text.includes(filter) ? '' : 'none'; // Muestra u oculta el elemento según el filtro
      });
    });

    // Mostrar detalles de la persona
    function viewPerson(dni) {
      fetch(`/get-person/${dni}/`)
        .then(response => response.json())
        .then(data => {
          document.getElementById('detail-cc').textContent = data.dni;
          document.getElementById('detail-nombre').textContent = data.name;
          document.getElementById('detail-telefono').textContent = data.phoneNumber;
          document.getElementById('detail-direccion').textContent = data.address;
          document.getElementById('detail-correo').textContent = data.email;
        })
        .catch(error => {
          console.error('Error:', error);
        });
    }
  </script>
{% endblock %}
