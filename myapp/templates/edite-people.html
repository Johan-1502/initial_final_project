{% extends 'barra_lateral.html' %}

{% block content %}

    <div class="main-panel">
      <!--
        <div class="side-panel col-md-4 col-lg-3">
          <div class="d-grid gap-2">
            <a href="{% url 'show_people' %}" class="btn btn-menu">
              <i class="bi bi-house me-2"></i>Home
            </a>
            <a href="{% url 'create_person' %}" class="btn btn-menu">
              <i class="bi bi-calendar-event me-2"></i>Crear Persona
            </a>
            <a href="{% url 'search_person' %}" class="btn btn-menu">
              <i class="bi bi-people me-2"></i>Buscar Persona
            </a>
            <a href="{% url 'show_people' %}" class="btn btn-menu">
              <i class="bi bi-file-earmark-text me-2"></i>Ver Personas
            </a>
          </div>
        </div>
        -->

      <!-- Content Panel -->
      <div class="content-panel col-md-8 col-lg-9 d-flex align-items-center justify-content-center">
        <div class="container" style="max-width: 1200px;">

          <!-- Botón de volver -->
          <div class="mb-3">
            <button type="button" class="btn btn-outline-secondary" onclick="window.history.back()">
              <i class="bi bi-arrow-left"></i>
            </button>
          </div>

          <h2 class="text-center mb-4">Editar Persona</h2>

          <div class="row g-3">
            <!-- Panel de búsqueda -->
            <div class="col-md-6">

              <form action="{% url 'search_person_to_edit' %}" method="POST">
                {% csrf_token %}
                <label for="searchInput" class="form-label fw-bold">Buscar por CC / Nombre</label>
                <input id="searchInput" name="dni" type="text" class="form-control mb-3"
                  placeholder="Escribe un nombre o cédula..." style="height: 4em;">
      
                <button class="btn btn-warning btn-lg rounded-3 mb-3">
                  buscar
                </button>
              </form>

              <ul id="resultsList" class="list-group">
                {% for person in people %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  <span>{{ person.dni }} - {{ person.name }}</span>
                  <button class="btn btn-sm btn-outline-primary"
                          onclick="mostrarDetalles(this)"
                          data-dni="{{ person.dni }}"
                          data-name="{{ person.name }}"
                          data-phone="{{ person.phoneNumber }}"
                          data-address="{{ person.address }}"
                          data-email="{{ person.email }}">
                    Ver
                  </button>
                </li>
                {% endfor %}
              </ul>
            </div>

            <!-- Panel de detalles -->
            <div class="col-md-6">
              <h5 class="fw-bold">Persona Seleccionada</h5>
              <div id="selectedPerson">
                <form action="{% url 'confirm_changes' %}" id="updateForm" method="POST">
                  {% csrf_token %}
                  <label for="detail-cc"><strong>CC:</strong></label>
                  <input id="detail-cc" name="dni" type="text" class="form-control mb-2" readonly>

                  <label for="detail-nombre"><strong>Nombre:</strong></label>
                  <input id="detail-nombre" name="name" type="text" class="form-control mb-2" disabled>

                  <label for="detail-telefono"><strong>Teléfono:</strong></label>
                  <input id="detail-telefono" name="phoneNumber" type="text" class="form-control mb-2" disabled>

                  <label for="detail-direccion"><strong>Dirección:</strong></label>
                  <input id="detail-direccion" name="address" type="text" class="form-control mb-2" disabled>

                  <label for="detail-correo"><strong>Correo:</strong></label>
                  <input id="detail-correo" name="email" type="text" class="form-control mb-2" disabled>

                  <button id="updateButton" type="submit" class="btn btn-success mt-3" disabled>Actualizar</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const resultsList = document.getElementById('resultsList');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const updateButton = document.getElementById('updateButton');
    const updateForm = document.getElementById('updateForm');

    const detailElements = {
      cc: document.getElementById('detail-cc'),
      nombre: document.getElementById('detail-nombre'),
      telefono: document.getElementById('detail-telefono'),
      direccion: document.getElementById('detail-direccion'),
      correo: document.getElementById('detail-correo'),
    };

    let selectedPersonDni = null; // Guardar el DNI de la persona seleccionada

    // Filtrar lista de personas al hacer clic en "Buscar"
    searchButton.addEventListener('click', function () {
      const query = searchInput.value.trim();

      // Realizar una solicitud al backend para obtener los resultados filtrados
      fetch(`/filter-people/?query=${query}`)
        .then(response => response.json())
        .then(data => {
          // Limpiar la lista actual
          resultsList.innerHTML = "";

          // Agregar los nuevos resultados a la lista
          data.people.forEach(person => {
            const li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between align-items-center";
            li.innerHTML = `
              <span>${person.dni} - ${person.name}</span>
              <button class="btn btn-sm btn-outline-primary"
                      onclick="mostrarDetalles(this)"
                      data-dni="${person.dni}"
                      data-name="${person.name}"
                      data-phone="${person.phoneNumber}"
                      data-address="${person.address}"
                      data-email="${person.email}">
                Ver
              </button>
            `;
            resultsList.appendChild(li);
          });
        })
        .catch(error => {
          console.error("Error al filtrar personas:", error);
        });
    });

    // Mostrar detalles de la persona
    function mostrarDetalles(button) {
      const persona = {
        dni: button.getAttribute('data-dni'),
        name: button.getAttribute('data-name'),
        phoneNumber: button.getAttribute('data-phone'),
        address: button.getAttribute('data-address'),
        email: button.getAttribute('data-email'),
      };

      // Habilitar los campos de texto y el botón de actualizar
      Object.values(detailElements).forEach(input => input.disabled = false);
      updateButton.disabled = false;

      // Guardar el DNI de la persona seleccionada
      selectedPersonDni = persona.dni;

      // Rellenar los campos con la información de la persona
      detailElements.cc.value = persona.dni;
      detailElements.nombre.value = persona.name;
      detailElements.telefono.value = persona.phoneNumber;
      detailElements.direccion.value = persona.address;
      detailElements.correo.value = persona.email;
    }

    // Actualizar la información de la persona
    updateButton.addEventListener('click', function () {
      if (!selectedPersonDni) {
        alert("Por favor, seleccione una persona primero.");
        return;
      }

      const formData = new FormData(updateForm);

      // Enviar los datos actualizados al backend
      fetch(`/update-person/`, {
        method: "POST",
        headers: {
          "X-CSRFToken": "{{ csrf_token }}", // Asegúrate de incluir el token CSRF
        },
        body: formData,
      })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            alert("Persona actualizada correctamente.");

            // Actualizar los campos de texto con los datos actualizados
            detailElements.cc.value = data.person.dni;
            detailElements.nombre.value = data.person.name;
            detailElements.telefono.value = data.person.phoneNumber;
            detailElements.direccion.value = data.person.address;
            detailElements.correo.value = data.person.email;

            // Actualizar la lista
            searchButton.click();
          } else {
            alert("Error al actualizar la persona: " + data.error);
          }
        })
        .catch(error => {
          console.error("Error al actualizar la persona:", error);
        });
    });
  </script>
{% endblock %}
