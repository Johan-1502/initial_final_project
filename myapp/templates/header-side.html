{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Persona</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script type="module" src="{% static 'js/main.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/general-styles.css' %}">
</head>

<body>
    <div class="layout-container">
        <!-- Cabecera principal movible -->
        <header class="header col-md-12" style="position:fixed; height:15vh">
            
                <div class="container text-center">
                    <h1><a class ="title-a" href="{% url 'index' %}">
                    <i class="fa-brands fa-redhat main-icon"></i>EventGest
                    </a></h1>
                </div>
            
        </header>

        <!-- Contenido principal -->
        <div class="main-panel d-flex">

            <!-- Barra lateral movible-->
            <div class="side-panel bg-light p-3 col-md-2 col-lg-2" style="position: fixed">
                <div class="d-grid gap-2">
                    <a href="{% url 'index' %}">
                        <button type="button" class="btn btn-menu btn-light text-start">
                            <i class="bi bi-house me-2"></i>Home
                        </button>
                    </a>
                    <button type="button" class="btn btn-menu btn-light text-start">
                        <i class="bi bi-calendar-event me-2"></i>Eventos
                    </button>
                    <a href="{% url 'manage_people' %}">
                        <button type="button" class="btn btn-menu btn-light text-start">
                            <i class="bi bi-people me-2"></i>Personas
                        </button>
                    </a>
                    <button type="button" class="btn btn-menu btn-light text-start">
                        <i class="bi bi-file-earmark-text me-2"></i>Informes
                    </button>
                </div>
            </div>
            <div class="main-panel main-content">
                
            {% block content %}
            {% endblock %}
            </div>

</body>

</html>
