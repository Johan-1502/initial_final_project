{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Persona</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <div class="layout-container">
        <!-- Header -->
        <header class="header">
            <div class="container text-center">
                <h1>EventGest</h1>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-panel d-flex">
            <!-- Side Panel (Barra lateral) -->
            <div class="side-panel bg-light p-3" style="width: 250px;">
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-menu btn-light text-start">
                        <i class="bi bi-house me-2"></i>Home
                    </button>
                    <button type="button" class="btn btn-menu btn-light text-start">
                        <i class="bi bi-calendar-event me-2"></i>Eventos
                    </button>
                    <a href="{% url 'index' %}">
                        <button type="button" class="btn btn-menu btn-light text-start">
                            <i class="bi bi-people me-2"></i>Personas
                        </button>
                    </a>
                    <button type="button" class="btn btn-menu btn-light text-start">
                        <i class="bi bi-file-earmark-text me-2"></i>Informes
                    </button>
                </div>
            </div>

            {% block content %}
            {% endblock %}

</body>

</html>
