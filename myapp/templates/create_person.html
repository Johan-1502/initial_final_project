<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear Persona</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="layout-container">
    <header class="header">
      <div class="container text-center">
        <h1>EventGest</h1>
      </div>
    </header>

    <div class="main-panel">
      <div class="content-panel col-md-8 col-lg-9 d-flex align-items-center justify-content-center">
        <div class="container" style="max-width: 1200px;">

          <!-- Botón de volver -->
          <div class="mb-3">
            <button type="button" class="btn btn-outline-secondary" onclick="window.history.back()">
              <i class="bi bi-arrow-left"></i>
            </button>
          </div>

          <h2 class="text-center mb-4">Crear una persona</h2>

          <!-- Formulario de Django -->
          <form method="POST">
            {% csrf_token %}
            <div class="row g-3">
              {{ form.as_p }}
            </div>
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-warning btn-lg">Crear</button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
