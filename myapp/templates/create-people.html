{% extends 'barra_lateral.html' %}

{% block content %}

<!-- Content Panel -->
<div class="content-panel flex-grow-1 d-flex align-items-center justify-content-center">
  <div class="container" style="max-width: 1200px;">

    <!-- Botón de volver -->
    <div class="mb-3">
      <button type="button" class="btn btn-outline-secondary" onclick="window.history.back()">
        <i class="bi bi-arrow-left"></i>
      </button>
    </div>

    <h2 class="text-center mb-4">Crear una persona</h2>

    <!-- Formulario de Django -->
    <form method="POST">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label for="id_dni" class="form-label">CC</label>
          {{ form.dni }}
        </div>
        <div class="col-md-6">
          <label for="id_name" class="form-label">Nombre</label>
          {{ form.name }}
        </div>
        <div class="col-md-6">
          <label for="id_address" class="form-label">Dirección</label>
          {{ form.address }}
        </div>
        <div class="col-md-6">
          <label for="id_phoneNumber" class="form-label">Teléfono</label>
          {{ form.phoneNumber }}
        </div>
        <div class="col-md-6">
          <label for="id_email" class="form-label">Correo</label>
          {{ form.email }}
        </div>
      </div>
      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-warning btn-lg">Crear</button>
      </div>
    </form>

  </div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
